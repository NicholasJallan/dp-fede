; /etc/php/8.2/fpm/conf.d/99-dp-fede.ini — réglages globaux de PHP-FPM 8.2.
;
; PHP 8.2-FPM ne sert QUE DP Assistant (PrestaShop/WordPress restent en 7.4) :
; ces réglages (non modifiables par pool) peuvent donc être globaux.
;
; Installation : sudo install -o root -g root -m 644 deploy/php-dp-fede.ini /etc/php/8.2/fpm/conf.d/99-dp-fede.ini

expose_php = Off

; OPcache — le déploiement recharge php8.2-fpm, ce qui vide le cache ;
; validate_timestamps reste actif par sécurité (revalidation toutes les 2 s).
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; APCu — cache JWKS Google (6 h) et liste des ports SHOM (24 h).
apc.enabled = 1
apc.shm_size = 16M
