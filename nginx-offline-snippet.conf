# DP Assistant — Snippet à appliquer dans /etc/nginx/sites-available/bullesenvalais
# (bloc server du sous-domaine dp-fede.bullesenvalais.ch)
#
# Pré-requis : sw.js et site.webmanifest sont déployés à la racine
# /var/www/html/dp-fede/. Le scope du SW = "/".

# ─── Headers sur le Service Worker ────────────────────────────────────────
# Le SW doit toujours être revalidé par le navigateur (jamais cache HTTP),
# sinon une nouvelle version ne sera jamais détectée. Service-Worker-Allowed
# n'est nécessaire que si on déplaçait sw.js hors racine — gardé par sécurité.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    expires off;
}

# ─── Manifest web ─────────────────────────────────────────────────────────
# Pas de cache long, comme le SW : pour pouvoir bumper l'icône/start_url.
location = /site.webmanifest {
    add_header Cache-Control "no-cache" always;
    types { } default_type "application/manifest+json";
}

# ─── Headers sécurité — bloc complet à inclure dans la directive server { } ─
#
# CSP avec report-uri vers le backend (cf. backend/routes/csp.php).
# Strict-Transport-Security à 1 an avec preload (préinscription HSTS).
# Permissions-Policy bloque caméra/micro/géoloc (jamais nécessaires).
# Referrer-Policy stricte par défaut.
#
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

add_header Content-Security-Policy "
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://accounts.google.com
                https://maps.googleapis.com https://maps.gstatic.com
                https://unpkg.com https://cdnjs.cloudflare.com;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: https://*.googleusercontent.com
                https://maps.gstatic.com https://maps.googleapis.com;
    connect-src 'self' https://maps.googleapis.com https://maps.gstatic.com
                https://api.open-meteo.com https://www.googleapis.com
                https://oauth2.googleapis.com https://accounts.google.com;
    frame-src   https://accounts.google.com;
    worker-src  'self';
    manifest-src 'self';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
    report-uri  /api/csp/report;
" always;

# ─── Test puis reload ─────────────────────────────────────────────────────
