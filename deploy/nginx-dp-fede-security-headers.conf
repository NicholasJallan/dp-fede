# /etc/nginx/snippets/dp-fede-security-headers.conf
#
# En-têtes de sécurité de DP Assistant. À inclure :
#   - au niveau server { } ;
#   - ET dans chaque location { } qui déclare ses propres add_header : nginx
#     n'hérite PAS des add_header du niveau supérieur dès qu'une location en
#     définit un (piège classique : sw.js perdait HSTS/CSP).
#
# Installation : sudo install -o root -g root -m 644 deploy/nginx-dp-fede-security-headers.conf \
#                  /etc/nginx/snippets/dp-fede-security-headers.conf

add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header X-Frame-Options            "DENY" always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# ── Content-Security-Policy ────────────────────────────────────────────────
# React/ReactDOM sont bundlés dans app.js (esbuild) : plus aucun script depuis
# unpkg.com ni cdnjs.cloudflare.com. Seuls tiers autorisés :
#   - Google Identity Services (login + jeton Drive) : accounts.google.com
#   - Google Maps JS + Places : maps.googleapis.com / maps.gstatic.com
#   - Google Fonts (CSS + fichiers)
#   - api.open-meteo.com (pré-remplissage météo), www.googleapis.com (Drive)
# Construite par concaténation pour rester lisible (une seule ligne envoyée).
set $dp_fede_csp "default-src 'self'; ";
set $dp_fede_csp "${dp_fede_csp}script-src 'self' https://accounts.google.com https://maps.googleapis.com https://maps.gstatic.com; ";
set $dp_fede_csp "${dp_fede_csp}style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; ";
set $dp_fede_csp "${dp_fede_csp}font-src 'self' https://fonts.gstatic.com data:; ";
set $dp_fede_csp "${dp_fede_csp}img-src 'self' data: https://*.googleusercontent.com https://maps.gstatic.com https://maps.googleapis.com https://*.ggpht.com; ";
set $dp_fede_csp "${dp_fede_csp}connect-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://api.open-meteo.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; ";
set $dp_fede_csp "${dp_fede_csp}frame-src https://accounts.google.com; ";
set $dp_fede_csp "${dp_fede_csp}worker-src 'self'; ";
set $dp_fede_csp "${dp_fede_csp}manifest-src 'self'; ";
set $dp_fede_csp "${dp_fede_csp}object-src 'none'; ";
set $dp_fede_csp "${dp_fede_csp}base-uri 'self'; ";
set $dp_fede_csp "${dp_fede_csp}form-action 'self'; ";
set $dp_fede_csp "${dp_fede_csp}frame-ancestors 'none'; ";
set $dp_fede_csp "${dp_fede_csp}report-uri /api/csp/report";
add_header Content-Security-Policy $dp_fede_csp always;
