name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Aucune clé Google Maps dans le dépôt
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::Clé AIza… détectée — elle doit rester dans la config nginx du Pi"
            exit 1
          fi

  backend:
    name: Backend — PHPUnit (PHP 8.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # Version de production (pool dp-fede sur le Pi) ; composer.json exige >= 8.5.
          php-version: '8.5'
          extensions: mbstring, gd, pdo_mysql, curl, openssl, xml, intl, apcu
          coverage: none
      # Cache des archives Composer : évite de retélécharger mPDF & co. depuis
      # codeload.github.com à chaque run (réponses 429 « Too Many Requests »).
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress
      - name: Syntaxe de tous les fichiers PHP (routes et templates non couverts par PHPUnit)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer test
      - run: composer audit
