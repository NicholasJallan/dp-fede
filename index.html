<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DP Assistant — aide au directeur de plongée</title>
  <meta name="description" content="Préparer et diriger une plongée : palanquées vérifiées selon le Code du sport, check-list et fiche de sécurité." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Favicons (icône DP Assistant : fiche + pavillon Alpha) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <link rel="icon" type="image/png" sizes="16x16"  href="/favicon-16x16.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32x32.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180"     href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0B2E4A" />
  <meta name="color-scheme" content="light dark" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>
  <!-- Fallback : si React ne monte pas dans les 12 s, afficher un message actionnable. -->
  <div id="load-fallback" class="load-fallback" role="alert">
    <div class="load-fallback-card">
      <h1>Chargement impossible</h1>
      <p>Les scripts de l'application n'ont pas pu être chargés. Videz le cache du site puis réessayez.</p>
      <button type="button" id="load-fallback-reset" class="btn primary">Vider le cache et recharger</button>
    </div>
  </div>
  <!-- Boot scripts (thème, fallback, GOOGLE_CLIENT_ID, gmapsReady callback, SW registration) -->
  <script src="inline-boot.js"></script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Google Maps JS API (Places) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&libraries=places&loading=async&callback=__gmapsReady" async defer></script>

  <!-- Bundle applicatif (esbuild : src/app/main.jsx → dist/app.js).
       React, la couche offline (store, outbox, sync), l'API et les règles
       métier sont tous des modules ES compilés dans ce fichier. -->
  <script src="app.js" defer></script>

  <!-- Service Worker enregistré par inline-boot.js -->
</body>
</html>
