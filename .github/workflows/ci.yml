name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Aucune clé Google Maps dans le dépôt
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::Clé AIza… détectée — elle doit rester dans la config nginx du Pi"
            exit 1
          fi

  backend:
    name: Backend — PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 : version minimale (composer.json) ; 8.5 : production (pool dp-fede sur le Pi).
        php: ['8.2', '8.5']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, pdo_mysql, curl, openssl, xml, intl, apcu
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Syntaxe de tous les fichiers PHP (routes et templates non couverts par PHPUnit)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer test
      - run: composer audit
