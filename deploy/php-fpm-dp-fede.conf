; /etc/php/8.5/fpm/pool.d/dp-fede.conf — pool PHP-FPM 8.5 dédié à DP Assistant.
;
; php8.5-fpm sert AUSSI une autre application (pool « dive », utilisateur
; bulles-php) : ce fichier ne touche à rien d'autre que [dp-fede], et aucun
; réglage global (conf.d/) n'est ajouté — tout ce qui est propre à dp-fede est
; posé ici en php_admin_*. PrestaShop et WordPress restent sur PHP 7.4.
; Procédure complète : docs/deploy/php85.md.
;
; Extensions requises (paquets php8.5-*) : mysql (pdo_mysql), mbstring, gd,
; xml, curl, intl, apcu ; OPcache est intégré à PHP 8.5.
;
; Installation :
;   sudo install -o root -g root -m 644 deploy/php-fpm-dp-fede.conf /etc/php/8.5/fpm/pool.d/dp-fede.conf
;   sudo php-fpm8.5 -t && sudo systemctl reload php8.5-fpm

[dp-fede]
user  = www-data
group = www-data

; Socket dédié — doit correspondre à fastcgi_pass dans deploy/nginx-dp-fede.conf.
listen       = /run/php/php8.5-fpm-dp-fede.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Raspberry Pi partagé : peu de workers, créés à la demande.
pm                      = ondemand
pm.max_children         = 4
pm.process_idle_timeout = 30s
pm.max_requests         = 500

request_terminate_timeout = 60s
; Statut pour diagnostic (servi uniquement si nginx l'expose — il ne l'expose pas).
pm.status_path = /fpm-status-dp-fede

; Le code ne lit que son répertoire, sa config, /tmp (mPDF) et l'archive des
; fiches de sécurité (A322-72, /var/lib/dp-fede/documents — config
; 'documents.path', cf. docs/deploy/club-socle.md).
; « /var/log/dp-fede » est un préfixe : journal d'audit (Log::action →
; /var/log/dp-fede.log) et rapports CSP (/var/log/dp-fede-csp.log). Sans lui,
; ces écritures échouent en silence.
php_admin_value[open_basedir]   = /var/www/dp-fede-api/:/var/lib/dp-fede/:/etc/dp-fede/:/tmp/:/var/log/dp-fede
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[log_errors]      = on
php_admin_flag[display_errors]  = off
php_admin_value[error_log]      = /var/log/dp-fede-php.log
php_admin_value[date.timezone]  = Europe/Paris
php_admin_value[memory_limit]   = 128M
php_admin_value[post_max_size]  = 4M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[max_execution_time]  = 30
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php]      = off

; OPcache : la taille de la mémoire partagée est commune à tous les pools de
; php8.5-fpm (valeur par défaut conservée). Le déploiement recharge
; php8.5-fpm, ce qui vide le cache ; revalidation toutes les 2 s par sécurité.
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq]     = 2

; APCu (cache JWKS Google 6 h, ports SHOM 24 h) : activé par défaut une fois
; php8.5-apcu installé ; clés préfixées « dp_fede_ » par le code.

; Variables d'environnement minimales (pas de clear_env = no).
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMPDIR] = /tmp
