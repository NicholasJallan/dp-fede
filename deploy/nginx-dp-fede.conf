# /etc/nginx/sites-available/dp-fede — bloc serveur de DP Assistant.
#
# Remplace l'ancien bloc dp-fede de /etc/nginx/sites-available/bullesenvalais
# (et l'ancien nginx-offline-snippet.conf à la racine du dépôt).
# Procédure de bascule : docs/deploy/php85.md (étape « nginx »).
#
# Placeholders à remplacer sur le Pi (JAMAIS de vraie valeur dans le dépôt) :
#   __CERT_NAME__              nom du certificat Let's Encrypt (sudo certbot certificates)
#   __VRAIE_CLE_MAPS__         la vraie clé Google Maps (AIza…), à reprendre de
#                               l'ancienne directive sub_filter du bloc dp-fede.
#                               NE PAS toucher au 1er argument __GOOGLE_MAPS_API_KEY__
#                               (c'est le placeholder présent dans index.html).
#
# Dépendances :
#   /etc/nginx/snippets/dp-fede-security-headers.conf  (deploy/nginx-dp-fede-security-headers.conf)
#   pool PHP-FPM 8.5 dp-fede → socket /run/php/php8.5-fpm-dp-fede.sock (deploy/php-fpm-dp-fede.conf)
#
# Test puis rechargement : sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dp-fede.bullesenvalais.ch;
    # Si certbot renouvelle en mode « webroot », reprendre ici la location
    # /.well-known/acme-challenge/ de l'ancien bloc (inutile avec --nginx).
    return 301 https://$host$request_uri;
}

server {
    # nginx ≥ 1.25.1 : remplacer « http2 » par la directive « http2 on; ».
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dp-fede.bullesenvalais.ch;

    ssl_certificate     /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/html/dp-fede;
    index index.html;

    server_tokens off;
    # Plongée complète (answers + palanquées + render_state ≤ 512 Ko) : large marge.
    client_max_body_size 4m;

    include snippets/dp-fede-security-headers.conf;

    # Fichiers cachés (.git, .env, .DS_Store…)
    location ~ /\. {
        return 404;
    }

    # ── API PHP (backend hors web root : /var/www/dp-fede-api) ─────────────
    # Seul index.php est exécutable ; bin/, lib/, vendor/… ne sont jamais servis.
    location /api/ {
        fastcgi_pass  unix:/run/php/php8.5-fpm-dp-fede.sock;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/dp-fede-api/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS           on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Rapports CSP : endpoint public, corps borné (le PHP refuse aussi > 8 Ko).
    location = /api/csp/report {
        client_max_body_size 16k;
        fastcgi_pass  unix:/run/php/php8.5-fpm-dp-fede.sock;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/dp-fede-api/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param HTTPS           on;
        fastcgi_hide_header X-Powered-By;
    }

    # ── PWA ─────────────────────────────────────────────────────────────────
    # Le Service Worker doit toujours être revalidé, sinon une nouvelle version
    # n'est jamais détectée par le navigateur.
    location = /sw.js {
        include snippets/dp-fede-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
    }

    location = /site.webmanifest {
        include snippets/dp-fede-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # ── HTML / JS / CSS ─────────────────────────────────────────────────────
    # Revalidation systématique (le SW gère le hors-ligne) + injection de la
    # clé Google Maps dans le HTML (le placeholder n'existe que dans index.html ;
    # text/html est le type par défaut de sub_filter : ne pas ajouter
    # sub_filter_types text/html, nginx avertirait « duplicate MIME type »).
    location ~* \.(?:html|js|jsx|css)$ {
        include snippets/dp-fede-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        sub_filter '__GOOGLE_MAPS_API_KEY__' '__VRAIE_CLE_MAPS__';
        sub_filter_once on;
    }

    # Images / polices : cache navigateur court (fichiers non fingerprintés).
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        include snippets/dp-fede-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # SPA : toute autre route renvoie index.html (repasse par la location
    # .html ci-dessus → sub_filter appliqué).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
