<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DP Assistant — Outil d'aide au Directeur de Plongée</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Favicons (FFESSM logo) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16"  href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180"     href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0a4a6e" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>
  <!-- Fallback : si React ne monte pas dans les 12 s, afficher un message actionnable. -->
  <div id="load-fallback" style="display:none;position:fixed;inset:0;background:#F4F1EA;
    align-items:center;justify-content:center;font-family:sans-serif;z-index:9999">
    <div style="max-width:360px;padding:24px;background:#fff;border-radius:10px;
      box-shadow:0 4px 20px rgba(0,0,0,.12);text-align:center">
      <div style="font-size:24px;margin-bottom:12px">⚠</div>
      <b style="font-size:16px">Chargement impossible</b>
      <p style="color:#5A6B7E;font-size:13px;margin:10px 0 18px">
        Les scripts de l'application n'ont pas pu être chargés.<br>
        Videz le cache du site puis réessayez.
      </p>
      <button onclick="
        if('serviceWorker' in navigator){
          navigator.serviceWorker.getRegistrations().then(regs=>{
            regs.forEach(r=>r.unregister());
            caches.keys().then(k=>Promise.all(k.map(n=>caches.delete(n)))).then(()=>location.reload());
          });
        } else { location.reload(); }
      " style="background:#0a4a6e;color:#fff;border:0;border-radius:6px;
        padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer">
        Vider le cache et recharger
      </button>
    </div>
  </div>
  <!-- Boot scripts (fallback timer, GOOGLE_CLIENT_ID, gmapsReady callback, SW registration) -->
  <script src="inline-boot.js"></script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Google Maps JS API (Places) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&libraries=places&callback=__gmapsReady" async defer></script>

  <!-- jsPDF + html2canvas (PDF generation for archive) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Helpers globaux : clés de stockage + Google Drive/OAuth/CSRF + upload REST -->
  <script src="lib/storage-keys.js"></script>
  <script src="lib/google-drive.js"></script>
  <script src="lib/drive-upload.js"></script>

  <!-- API fetch wrapper (utilise window.getCsrfToken défini ci-dessus) -->
  <script src="api.js"></script>

  <!-- Détection online/offline + polyfill randomUUID -->
  <script src="lib/net.js"></script>

  <!-- Couche offline : store IndexedDB → outbox → sync orchestrator → wrapper api.
       Doit être chargée AVANT les JSX qui consomment window.api, car offline-api.js
       décore les méthodes de api.* (interception). -->
  <script src="lib/offline-store.js"></script>
  <script src="lib/outbox.js"></script>
  <script src="lib/sync.js"></script>
  <script src="lib/offline-api.js"></script>

  <!-- Logique métier pure (chargée avant data.js — exporte validatePal, peLevel, getMaxEnsLevel, computePalHardLimit, clampProfMax) -->
  <script src="lib/depth-clamp.js"></script>
  <script src="lib/pal-rules.js"></script>

  <!-- Données métier -->
  <script src="data.js"></script>

  <!-- Composants UI et écrans -->
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="toast.jsx"></script>
  <script type="text/babel" src="auth-context.jsx"></script>
  <!-- Hooks réutilisables (doivent être chargés avant les screens qui les consomment) -->
  <script type="text/babel" src="lib/use-auto-save.jsx"></script>
  <script type="text/babel" src="diver-form.jsx"></script>
  <script type="text/babel" src="screen-login.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-profil.jsx"></script>
  <script type="text/babel" src="screen-palanquees.jsx"></script>
  <script type="text/babel" src="screen-checklist.jsx"></script>
  <script type="text/babel" src="screen-fiche.jsx"></script>
  <script type="text/babel" src="screen-account.jsx"></script>
  <script type="text/babel" src="screen-admin-divers.jsx"></script>
  <script type="text/babel" src="screen-admin-sites.jsx"></script>
  <script type="text/babel" src="screen-admin-users.jsx"></script>
  <script type="text/babel" src="screen-archive.jsx"></script>
  <script type="text/babel" src="screen-archives.jsx"></script>
  <script type="text/babel" src="screen-splash.jsx"></script>

  <!-- App entry -->
  <script type="text/babel" src="app.jsx"></script>

  <!-- Service Worker enregistré par inline-boot.js -->
</body>
</html>
