; /etc/php/8.2/fpm/pool.d/dp-fede.conf — pool PHP-FPM 8.2 dédié à DP Assistant.
;
; PrestaShop et WordPress restent sur PHP 7.4 (pools /etc/php/7.4/fpm/pool.d/).
; Procédure complète : docs/deploy/php82-migration.md.
;
; Installation :
;   sudo install -o root -g root -m 644 deploy/php-fpm-dp-fede.conf /etc/php/8.2/fpm/pool.d/dp-fede.conf
;   sudo php-fpm8.2 -t && sudo systemctl reload php8.2-fpm

[dp-fede]
user  = www-data
group = www-data

; Socket dédié — doit correspondre à fastcgi_pass dans deploy/nginx-dp-fede.conf.
listen       = /run/php/php8.2-fpm-dp-fede.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Raspberry Pi partagé : peu de workers, créés à la demande.
pm                      = ondemand
pm.max_children         = 4
pm.process_idle_timeout = 30s
pm.max_requests         = 500

request_terminate_timeout = 60s
; Statut pour diagnostic (servi uniquement si nginx l'expose — il ne l'expose pas).
pm.status_path = /fpm-status-dp-fede

; Le code ne lit que son répertoire, sa config, /tmp (mPDF), ses journaux et
; l'archive des fiches de sécurité (A322-72, /var/lib/dp-fede/documents —
; config 'documents.path', cf. docs/deploy/club-socle.md).
; « /var/log/dp-fede » est un préfixe : couvre dp-fede.log, dp-fede-csp.log…
php_admin_value[open_basedir]   = /var/www/dp-fede-api/:/etc/dp-fede/:/tmp/:/var/log/dp-fede:/var/lib/dp-fede/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[log_errors]      = on
php_admin_flag[display_errors]  = off
php_admin_value[error_log]      = /var/log/dp-fede-php.log
php_admin_value[memory_limit]   = 128M
php_admin_value[post_max_size]  = 4M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[max_execution_time]  = 30
; Fuseau : reprendre EXACTEMENT celui de PHP 7.4 (php7.4 -i | grep date.timezone),
; sinon les dates de session (PHP) et NOW() (MariaDB) divergent.
;php_admin_value[date.timezone] = Europe/Zurich
php_admin_flag[allow_url_include] = off

; Variables d'environnement minimales (pas de clear_env = no).
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMPDIR] = /tmp
